{% extends "navigation.html" %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='ExpenseTable/table.css') }}">

<div class="expense-dashboard">

    <!--- Header -->
    <div class="page-header">
        <div>
            <p class="page-subtitle">PENNY / EXPENSES</p>
            <h1>Expense Table</h1>
        </div>

        <a href="{{ url_for('add_expense_route.add_expense') }}" class="table-button">
            + Add Expense/ Category
        </a>
    </div>

    <!-- Overview -->
    <div class="expense-summary">
        <div class="expense-overview">
            <p>Total Expenses</p>
            <h2 id="summary-total">$0.00</h2>
        </div>

        <div class="expense-total-summary">
            <p>Transactions</p>
            <h2 id="summary-count">0</h2>
        </div>

        <div class="largest-expense-summary">
            <p>Largest Expense</p>
            <h2 id="summary-largest">$0.00</h2>
        </div>
    </div>

    <!--- Expense Table -->
    <div class="table-container">

        <div class="table-header">
            <h2>Expense Items</h2>
        </div>

        <!-- FILTERS -->
        <div class="table-filters">
            <input type="search"
                   id="search-filter"
                   placeholder="Search expenses">

            <select id="category-filter" name="category">
                <option value="all">All Categories</option>
            </select>

            <label for="dateStart-filter">Start Date:</label>
            <input type="date" id="dateStart-filter">

            <label for="dateEnd-filter">End Date:</label>
            <input type="date" id="dateEnd-filter">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>
                            <input type="checkbox" id="select-all">
                        </th>
                        <th>Date</th>
                        <th>Expense</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount($)</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="expense-table-body">
                    <!-- Expense rows populated here -->
                </tbody>
            </table>
        </div>

    </div>
</div>

{% endblock %}
