{#
<!--
Author: Layce Smith
Purpose: Navigation sidebar layout shared by every Penny page (sidebar navigation + page wrapper)
Usage: Other templates should start with {% extends "base.html" %} and put their content inside {% block content %} ... {% endblock %}
Last updated: 11/4/2026
-->
#}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--Makes the page scale correctly on phones and small screens-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Penny</title>
    <!--url_for builds the correct path to static/profile.css from any page URL-->
    <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">  
</head>
<body>
    <!--Sidebar navigation, shown on every page that extends this template-->
    <nav class="sidebar">
        <ul class="sidebar-links">
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Expenses</a></li>
            <li><a href="#">Profile</a></li>
            <li><a href="#">Logout</a></li>
        </ul>
    </nav>
    <!--Main content area; .page has a left margin so it isn't hidden behind the sidebar-->
    <main class="page">
        <!--Each page fills this block with its own content-->
        {% block content %}{% endblock %}
    </main>
</body>
</html>
